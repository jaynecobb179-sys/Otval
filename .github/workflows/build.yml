name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Распаковать ZIP, если проект залит архивом
        run: |
          if [ ! -f settings.gradle.kts ]; then
            Z=$(ls *.zip | head -n1)
            echo "Распаковываю $Z"
            mkdir -p _src
            unzip -q "$Z" -d _src
          fi

      - name: Найти проект
        id: loc
        run: |
          F=$(find . -name settings.gradle.kts -not -path "./.git/*" | head -n1)
          echo "Проект: $F"
          echo "dir=$(dirname "$F")" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Сборка debug APK
        working-directory: ${{ steps.loc.outputs.dir }}
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Выложить APK в Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "Что отвалилось — сборка ${{ github.run_number }}"
          files: ${{ steps.loc.outputs.dir }}/app/build/outputs/apk/debug/app-debug.apk
